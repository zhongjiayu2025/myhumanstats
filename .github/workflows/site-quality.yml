name: Site quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'seo/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check
        run: npx tsc --noEmit
      - name: Static export
        run: npm run build
      - name: Audit all 35 test registrations, score IDs and static pages
        run: node scripts/audit-tests.mjs
      - name: Audit canonical, metadata and unique content on every test page
        run: node scripts/audit-seo-export.mjs
      - name: Verify structured data parity and capture SEO drift baseline
        run: node scripts/capture-seo-baseline.mjs
      - name: Upload SEO baseline for drift comparison
        uses: actions/upload-artifact@v4
        with:
          name: seo-baseline
          path: reports/seo-baseline.json
          retention-days: 30
      - name: Install headless Chromium for mobile interaction tests
        run: npx playwright install --with-deps chromium
      - name: Run mobile Chromium interactions
        run: npx playwright test --config=playwright.config.ts
      - name: Verify SEO and core static routes
        run: |
          test -f out/index.html
          test -f out/build-info.json
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/test/rhythm-test/index.html
          test -f out/test/contrast-test/index.html
          test -f out/test/color-hue-test/index.html
          test -f out/test/perfect-pitch-test/index.html
          test -f out/test/peripheral-vision-test/index.html
          test -f out/tools/tone-generator/index.html
          if grep -R -q '#/test/' out/blog; then
            echo 'Legacy hash-router links detected in exported blog pages.'
            exit 1
          fi
