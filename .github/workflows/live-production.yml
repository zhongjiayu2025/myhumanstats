name: Verify live production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the latest Cloudflare production SHA and public pages
        run: node scripts/verify-production.mjs
